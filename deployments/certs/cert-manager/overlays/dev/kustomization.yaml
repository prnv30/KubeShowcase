helmGlobals:
  chartHome: ../../base/
helmCharts:
  - name: cert-manager
    repo: https://charts.bitnami.com/bitnami
    releaseName: cert-manager
    namespace: cert-manager
    version: 1.5.13
    includeCRDs: true
  - name: app-certs
    releaseName: app-certs
    valuesFile: app-certs-values.yaml
    namespace: cert-manager
