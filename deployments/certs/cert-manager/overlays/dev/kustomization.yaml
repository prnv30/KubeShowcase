helmGlobals:
  chartHome: ../../base/
helmCharts:
  - name: cert-manager
    repo: https://charts.bitnami.com/bitnami
    releaseName: cert-manager
    valuesFile: values.yaml
    version: 1.5.13
    includeCRDs: true
    namespace: certs

  - name: app-certs
    releaseName: app-certs
    valuesFile: app-certs-values.yaml
    namespace: certs

resources:
  - ../../base/cluster-issuer.yaml
  - ../../base/certificate.yaml